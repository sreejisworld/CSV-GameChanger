name: EVOLV Compliance Gate

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  compliance:
    name: GAMP 5 / 21 CFR Part 11 Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install --quiet fastapi pydantic

      - name: Run EVOLV compliance checks
        run: |
          chmod +x scripts/compliance_check.sh
          bash scripts/compliance_check.sh

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-${{ github.run_number }}
          path: |
            output/dev_audit_trail.csv
          if-no-files-found: ignore
          retention-days: 90

  trusted-evals:
    name: Trusted Evals (131 deterministic checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The deterministic eval suite is stdlib-only by design —
      # no pip installs, no API keys, no server. 131 evals across
      # 6 agents must pass before any change ships.
      - name: Run eval suite
        run: |
          PYTHONIOENCODING=utf-8 python -m Agents.eval_suite \
            --json --out eval-report.json
          PYTHONIOENCODING=utf-8 python - <<'EOF'
          import json, sys
          runs = json.load(open("eval-report.json"))
          total = sum(r["eval_count"] for r in runs)
          failed = [
              x["eval_id"]
              for r in runs
              for x in r["results"]
              if not x["passed"]
          ]
          print(f"{total} evals · {len(failed)} failed")
          if failed:
              print("FAILED:", failed)
              sys.exit(1)
          EOF

      - name: Verify audit chain integrity logic
        run: |
          PYTHONIOENCODING=utf-8 python scripts/verify_audit_chain.py || true
          # (Repo audit CSV is generated locally; the chain evals
          # above are the enforced gate. This step surfaces the
          # verifier output for the CI log.)

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_number }}
          path: eval-report.json
          retention-days: 90

  dependency-audit:
    name: Dependency CVE Audit (pip-audit / SEC-10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pip-audit

      # Blocking by design: a new CVE in the dependency tree
      # should stop the pipeline, not hide in a warning.
      # Requirements mode audits EVOLV's resolved dependency
      # tree only — the runner's own toolchain (old pip etc.)
      # is out of scope. If a finding has no fix yet, add a
      # documented --ignore-vuln ID flag with an advisory link.
      - name: Run pip-audit
        run: |
          python -m pip_audit -r requirements.txt \
            --progress-spinner off

  python-lint:
    name: PEP 8 / Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install --quiet flake8

      - name: Run flake8 (Agents/, API/, utils/)
        run: |
          flake8 Agents/ API/ utils/ \
            --max-line-length=79 \
            --extend-ignore=E203,W503,E501 \
            --count \
            --statistics \
            || true  # warn only — do not block on style

  react-build:
    name: React Platform Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: react-platform/package-lock.json

      - name: Install dependencies
        working-directory: react-platform
        run: npm ci

      - name: Build React Platform
        working-directory: react-platform
        run: npm run build
        env:
          CI: false  # treat warnings as warnings, not errors
