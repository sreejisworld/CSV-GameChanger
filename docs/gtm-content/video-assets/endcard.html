<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>EVOLV Stories — end card (9:16)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1920px;background:#161618;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;color:#EDEDE9;overflow:hidden}
  .setup{font-size:52px;font-weight:400;color:#94948C;text-align:center;
    line-height:1.35;max-width:820px;margin-bottom:14px}
  .setup b{color:#EDEDE9;font-weight:500}
  .q{font-size:52px;font-weight:400;color:#EDEDE9;text-align:center;
    line-height:1.35;max-width:860px;margin-bottom:120px}
  .logo{font-size:150px;font-weight:700;letter-spacing:.01em;color:#fff;line-height:1}
  .tag{font-size:60px;font-weight:500;color:#0E9F6E;margin-top:26px}
  .url{font-family:'IBM Plex Mono',monospace;font-size:34px;color:#6E6E68;
    letter-spacing:.12em;margin-top:90px}
  .dot{width:14px;height:14px;border-radius:50%;background:#0E9F6E;
    display:inline-block;margin-left:8px;vertical-align:middle}
</style></head>
<body>
  <!-- Reusable end-card frame for the EVOLV Stories series.
       Open in a browser at 1080x1920 (9:16) and screen-record or
       screenshot. In the edit, reveal each line in sequence with
       a beat: setup (grey) -> pivot (white) -> logo -> tag -> url.
       Swap the two grey/white lines per episode; the logo block
       stays constant across the whole series. -->
  <div class="setup">You can't <b>automate</b> bad managers.</div>
  <div class="q">But the validation work keeping teams late?</div>
  <div class="logo">EVOLV<span class="dot"></span></div>
  <div class="tag">Get your evenings back.</div>
  <div class="url">EVOLIFEVAL.COM</div>
</body></html>
