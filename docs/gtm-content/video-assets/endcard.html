<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>EVOLV Stories — end card (9:16, animated)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0d0e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',system-ui,sans-serif}
  /* 9:16 stage that scales to fit any window; height-driven */
  .stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;
    background:#161618;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;padding:0 6%}
  .line{opacity:0;text-align:center;line-height:1.3;
    animation:cycle 9s ease-in-out infinite}
  .setup{font-size:3.1vh;font-weight:400;color:#94948C;margin-bottom:1.2vh;
    animation-delay:0s}
  .setup b{color:#EDEDE9;font-weight:500}
  .q{font-size:3.1vh;font-weight:400;color:#EDEDE9;margin-bottom:8vh;
    animation-delay:0s}
  .logo{font-size:9vh;font-weight:700;letter-spacing:.01em;color:#fff;
    line-height:1;animation-delay:0s}
  .tag{font-size:3.6vh;font-weight:500;color:#0E9F6E;margin-top:1.8vh;
    animation-delay:0s}
  .url{font-family:'IBM Plex Mono',monospace;font-size:2vh;color:#6E6E68;
    letter-spacing:.14em;margin-top:6vh;animation-delay:0s}
  .dot{width:1.1vh;height:1.1vh;border-radius:50%;background:#0E9F6E;
    display:inline-block;margin-left:.6vh;vertical-align:middle}
  /* staggered reveal encoded in the timeline so infinite-loop keeps the stagger */
  .setup{animation-name:s1} .q{animation-name:s2} .logo{animation-name:s3}
  .tag{animation-name:s4} .url{animation-name:s5}
  @keyframes s1{0%,3%{opacity:0}6%,82%{opacity:1}90%,100%{opacity:0}}
  @keyframes s2{0%,13%{opacity:0}17%,82%{opacity:1}90%,100%{opacity:0}}
  @keyframes s3{0%,28%{opacity:0}33%,82%{opacity:1}90%,100%{opacity:0}}
  @keyframes s4{0%,37%{opacity:0}42%,82%{opacity:1}90%,100%{opacity:0}}
  @keyframes s5{0%,49%{opacity:0}54%,82%{opacity:1}90%,100%{opacity:0}}
  .hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:#3a3a3c}
</style></head>
<body>
  <div class="stage">
    <div class="line setup">You can't <b>automate</b> bad managers.</div>
    <div class="line q">But the validation work keeping teams late?</div>
    <div class="line logo">EVOLV<span class="dot"></span></div>
    <div class="line tag">Get your evenings back.</div>
    <div class="line url">EVOLIFEVAL.COM</div>
  </div>
  <div class="hint">loops every 9s · screen-record the stage · click to restart</div>
  <script>
    document.body.addEventListener('click',function(){
      document.querySelectorAll('.line').forEach(function(el){
        el.style.animation='none'; void el.offsetWidth;
        el.style.animation='';
      });
    });
  </script>
</body></html>
