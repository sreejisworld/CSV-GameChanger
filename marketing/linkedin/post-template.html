<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EVOLV — LinkedIn post image template (1080x1350)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;align-items:center;justify-content:center}

  /* LinkedIn portrait post = 1080 x 1350 (4:5) — the tallest
     format the feed allows, so it occupies the most screen. */
  #card{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:#0A1210;
    font-family:'Space Grotesk',system-ui,sans-serif;
    --mint:#12E29B; --ink:#F2F6F4; --muted:#7C8B84; --dim:#4A5A54;
  }
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(18,226,155,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(18,226,155,.05) 1px,transparent 1px);
    background-size:60px 60px;}

  /* ── MOTIF layer ──────────────────────────────────────────────
     A ghosted artifact from the world the post describes — a test
     script form, a signature block — bleeding through behind the
     type. Gives the card texture without decorating it. */
  #motif{position:absolute;inset:0;opacity:.13;pointer-events:none;
    font-family:'IBM Plex Mono',monospace;color:#CFEFE2;}
  #motif .row{position:absolute;left:92px;right:92px;
    display:flex;align-items:center;gap:22px;font-size:23px;
    border-bottom:1px solid rgba(207,239,226,.22);padding-bottom:13px;}
  #motif .box{width:23px;height:23px;flex:0 0 auto;
    border:2px solid rgba(207,239,226,.55);border-radius:3px;}
  #motif .box.on{background:rgba(207,239,226,.5);}
  #motif .amend{color:#12E29B;opacity:.9;letter-spacing:.1em;}
  #motif .sigline{position:absolute;left:92px;right:300px;
    border-bottom:2px solid rgba(207,239,226,.4);}
  #motif .sigcap{position:absolute;font-size:19px;
    letter-spacing:.18em;text-transform:uppercase;opacity:.8;}
  /* 'document' motif — a contents page with dotted leaders, so the
     page count itself is the evidence */
  #motif .drow{position:absolute;left:92px;right:92px;display:flex;
    align-items:baseline;font-size:23px;}
  #motif .dots{flex:1 1 auto;margin:0 14px;
    border-bottom:2px dotted rgba(207,239,226,.35);
    transform:translateY(-6px);}
  #motif .dpage{flex:0 0 auto;width:64px;text-align:right;}
  #motif .rel-hit{color:#12E29B;opacity:1;
    border-bottom-color:rgba(18,226,155,.5);}
  #motif .drow.hit{color:#12E29B;opacity:1;}
  #motif .drow.hit .dots{border-bottom-color:rgba(18,226,155,.55);}
  /* scrim keeps the headline crisp where it crosses the motif */
  #scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(10,18,16,0) 0%, rgba(10,18,16,.55) 38%,
      rgba(10,18,16,.92) 50%, rgba(10,18,16,.92) 72%,
      rgba(10,18,16,.55) 84%, rgba(10,18,16,0) 100%);}
  .glow{position:absolute;width:1000px;height:1000px;right:-260px;top:-400px;
    background:radial-gradient(circle,rgba(18,226,155,.15) 0%,transparent 62%);}

  .pad{position:absolute;inset:0;padding:96px 92px 92px;
    display:flex;flex-direction:column;}

  /* kicker — series label, builds recognition across posts */
  #kicker{font-family:'IBM Plex Mono',monospace;font-size:20px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--mint);
    display:flex;align-items:center;gap:14px;flex:0 0 auto;}
  #kicker::before{content:"";width:34px;height:2px;background:var(--mint);}

  /* main body — vertically centred between kicker and footer */
  #body{flex:1 1 auto;display:flex;flex-direction:column;
    justify-content:center;min-height:0;padding:44px 0;}

  #text{color:var(--ink);font-weight:700;line-height:1.14;
    letter-spacing:-.02em;}
  /* global so every text element (incl. the contrast halves) picks
     these up — scoping them to #text silently killed the accent */
  .em{color:var(--mint);}
  .strike{color:var(--dim);text-decoration:line-through;
    text-decoration-thickness:4px;}

  /* stat type */
  #stat{color:var(--mint);font-weight:700;line-height:.92;
    letter-spacing:-.035em;}
  #statSub{color:var(--ink);font-weight:600;line-height:1.2;
    letter-spacing:-.01em;margin-top:34px;}

  /* contrast type */
  .rule{height:2px;background:rgba(255,255,255,.10);margin:44px 0;}

  /* footer */
  #foot{flex:0 0 auto;display:flex;align-items:flex-end;
    justify-content:space-between;gap:20px;}
  .mark{display:flex;align-items:center;gap:13px;}
  .tick{width:34px;height:34px;border-radius:9px;background:var(--mint);
    display:flex;align-items:center;justify-content:center;
    color:#06231A;font-size:20px;font-weight:700;}
  .mark span{color:var(--ink);font-weight:600;font-size:24px;
    letter-spacing:.20em;}
  #handle{font-family:'IBM Plex Mono',monospace;font-size:19px;
    color:var(--muted);text-align:right;line-height:1.5;}
</style>
</head>
<body>
  <div id="card">
    <div class="grid"></div><div id="motif"></div>
    <div id="scrim"></div><div class="glow"></div>
    <div class="pad">
      <div id="kicker"></div>
      <div id="body"></div>
      <div id="foot">
        <div class="mark"><div class="tick">&#10003;</div><span>EVOLV</span></div>
        <div id="handle"></div>
      </div>
    </div>
  </div>

<script>
/* Mark accent words with *asterisks*  →  rendered in mint.
   Mark struck-through words with ~tildes~ (contrast type).      */
function fmt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/~([^~]+)~/g,'<span class="strike">$1</span>')
    .replace(/\*([^*]+)\*/g,'<span class="em">$1</span>')
    .replace(/\n/g,'<br>');
}

/* Shrink until the block fits its box AND respects the line breaks
   the author wrote. Checking only vertical overflow isn't enough —
   a line can still wrap where you didn't want it while the block
   still fits the height. So we also count rendered lines against
   intended (\n) lines and keep shrinking until they agree. */
function fit(el, start, min, intended, lh){
  const box = document.getElementById('body');
  lh = lh || 1.14;
  let size = start;
  el.style.fontSize = size + 'px';
  while (size > min) {
    const rendered = Math.round(el.offsetHeight / (size * lh));
    const fitsHeight = box.scrollHeight <= box.clientHeight;
    if (fitsHeight && rendered <= intended) break;
    size -= 2;
    el.style.fontSize = size + 'px';
  }
  return size;
}

/* how many lines the author asked for */
function lineCount(s){
  return String(s || '').split('\n').length;
}

/* Ghosted artifacts. 'script' = a test-script form with an amended
   step; 'signoff' = an unread signature block. */
function motif(kind){
  const m = document.getElementById('motif');
  m.innerHTML = '';
  if (kind === 'script') {
    // fills the full card so the texture reads as one document
    const rows = [
      ['on',  'STEP 01', 'Log in as System Owner', 'PASS'],
      ['on',  'STEP 02', 'Navigate to Access Control', 'PASS'],
      ['on',  'STEP 03', 'Select user role', 'PASS'],
      ['',    'STEP 04', 'Screen does not exist', 'AMENDED'],
      ['',    'STEP 05', 'Approval step not in script', 'AMENDED'],
      ['',    'STEP 06', 'Field renamed in build 4.2', 'AMENDED'],
      ['',    'STEP 07', 'Re-executed after script update', 'AMENDED'],
      ['',    'STEP 08', 'Evidence recaptured', 'AMENDED'],
      ['on',  'STEP 09', 'Reviewed by QA', 'PASS'],
      ['on',  'STEP 10', 'Approved for release', 'PASS'],
      ['on',  'STEP 11', 'Attached to validation package', 'PASS'],
      ['on',  'STEP 12', 'Filed', 'PASS'],
    ];
    rows.forEach(function(r, i){
      const d = document.createElement('div');
      d.className = 'row';
      d.style.top = (150 + i * 96) + 'px';
      const amended = r[3] === 'AMENDED';
      d.innerHTML =
        '<div class="box' + (r[0] ? ' on' : '') + '"></div>' +
        '<div style="flex:0 0 auto;width:130px">' + r[1] + '</div>' +
        '<div style="flex:1 1 auto">' + r[2] + '</div>' +
        '<div class="' + (amended ? 'amend' : '') + '">' + r[3] + '</div>';
      m.appendChild(d);
    });
  } else if (kind === 'document') {
    // contents page of a 340-page validation package; the row the
    // headline refers to is highlighted
    const toc = [
      ['1.  Purpose', '1'],
      ['2.  Scope', '3'],
      ['3.  System Description', '4'],
      ['4.  Roles and Responsibilities', '11'],
      ['5.  Risk Assessment', '24'],
      ['6.  Requirements Traceability', '58'],
      ['7.  Installation Qualification', '96'],
      ['8.  Operational Qualification', '141'],
      ['9.  Performance Qualification', '203'],
      ['10. Deviations and Resolutions', '248'],
      ['11. Conclusion', '271'],
      ['Appendix A  Test Evidence', '274'],
      ['Appendix B  Screenshots', '298'],
      ['Appendix C  Signature Manifest', '340'],
    ];
    toc.forEach(function(r, i){
      const d = document.createElement('div');
      d.className = 'drow' + (r[1] === '4' ? ' hit' : '');
      d.style.top = (140 + i * 84) + 'px';
      d.innerHTML = '<span>' + r[0] + '</span>'
        + '<span class="dots"></span>'
        + '<span class="dpage">' + r[1] + '</span>';
      m.appendChild(d);
    });
  } else if (kind === 'release') {
    // a vendor changelog with the model swap buried among cosmetics
    const notes = [
      ['v4.2.1', 'Improved dashboard load time', ''],
      ['v4.2.1', 'Fixed CSV export column order', ''],
      ['v4.2.1', 'Updated underlying language model', 'hit'],
      ['v4.2.1', 'Minor UI refinements', ''],
      ['v4.2.0', 'Added bulk upload', ''],
      ['v4.2.0', 'New notification preferences', ''],
      ['v4.1.9', 'Performance improvements', ''],
      ['v4.1.9', 'Security patches', ''],
      ['v4.1.8', 'Accessibility fixes', ''],
      ['v4.1.8', 'Updated help documentation', ''],
      ['v4.1.7', 'Bug fixes', ''],
      ['v4.1.7', 'Localisation updates', ''],
    ];
    notes.forEach(function(r, i){
      const d = document.createElement('div');
      d.className = 'row' + (r[2] ? ' rel-hit' : '');
      d.style.top = (150 + i * 96) + 'px';
      d.innerHTML =
        '<div style="flex:0 0 auto;width:118px">' + r[0] + '</div>'
        + '<div style="flex:1 1 auto">' + r[1] + '</div>'
        + (r[2] ? '<div class="amend">MODEL CHANGE</div>' : '');
      m.appendChild(d);
    });
  } else if (kind === 'signoff') {
    ['Reviewed by', 'Approved by', 'QA release'].forEach(function(c, i){
      const y = 250 + i * 300;
      const cap = document.createElement('div');
      cap.className = 'sigcap';
      cap.style.cssText = 'left:92px;top:' + y + 'px';
      cap.textContent = c;
      const ln = document.createElement('div');
      ln.className = 'sigline';
      ln.style.top = (y + 62) + 'px';
      m.appendChild(cap); m.appendChild(ln);
    });
  }
}

window.renderPost = function(cfg){
  const body = document.getElementById('body');
  motif(cfg.motif);
  document.getElementById('kicker').textContent = cfg.kicker || 'THE VALIDATION EDGE';
  document.getElementById('handle').innerHTML =
    fmt(cfg.handle || 'Sreejith Kanhirangadan\nevolifeval.com');

  const type = cfg.type || 'statement';
  body.innerHTML = '';

  if (type === 'stat') {
    const n = document.createElement('div');
    n.id = 'stat'; n.innerHTML = fmt(cfg.stat || '');
    const s = document.createElement('div');
    s.id = 'statSub'; s.innerHTML = fmt(cfg.text || '');
    body.appendChild(n); body.appendChild(s);
    s.style.fontSize = '46px';
    fit(s, 46, 26, lineCount(cfg.text), 1.2);
    fit(n, 210, 90, lineCount(cfg.stat), 0.92);
  } else if (type === 'contrast') {
    const a = document.createElement('div');
    a.id = 'text'; a.innerHTML = fmt(cfg.before || '');
    const r = document.createElement('div'); r.className = 'rule';
    const b = document.createElement('div');
    b.id = 'text2'; b.innerHTML = fmt(cfg.after || '');
    b.style.cssText = 'color:#F2F6F4;font-weight:700;line-height:1.14;letter-spacing:-.02em;';
    body.appendChild(a); body.appendChild(r); body.appendChild(b);
    // shrink both halves together so they stay visually equal
    let size = 66;
    const wantA = lineCount(cfg.before), wantB = lineCount(cfg.after);
    a.style.fontSize = size + 'px'; b.style.fontSize = size + 'px';
    while (size > 34) {
      const gotA = Math.round(a.offsetHeight / (size * 1.14));
      const gotB = Math.round(b.offsetHeight / (size * 1.14));
      if (body.scrollHeight <= body.clientHeight
          && gotA <= wantA && gotB <= wantB) break;
      size -= 2;
      a.style.fontSize = size + 'px'; b.style.fontSize = size + 'px';
    }
  } else {
    const t = document.createElement('div');
    t.id = 'text'; t.innerHTML = fmt(cfg.text || '');
    body.appendChild(t);
    fit(t, cfg.size || 104, 40, lineCount(cfg.text), 1.14);
  }
  return true;
};

/* default render so the file previews standalone */
window.addEventListener('load', function(){
  window.renderPost({
    type:'statement',
    text:"We wrote the test script\n*after* we ran the test."
  });
});
</script>
</body>
</html>
